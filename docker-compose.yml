services:
  web:
    build: .
    volumes:
      - ./log:/rails/log
      - ./storage:/rails/storage
    ports:
      - "3001:80"
      - "3002:3000"
    environment:
      - REDIS_URL=redis://redis-db:6379
      - DATABASE_URL=postgresql://root:password@postgres-db:5432/awd8_production
    secrets:
      - source: master_key
        target: /rails/config/master.key
    depends_on:
      redis-db:
        condition: service_started
      postgres-db:
        condition: service_healthy

  postgres-db:
    image: postgres:17
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: awd8_production
    volumes:
      - ./tmp/postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready
      interval: 2s
      timeout: 5s
      retries: 30

  redis-db:
    image: redis
secrets:
  master_key:
    file: ./config/master.key